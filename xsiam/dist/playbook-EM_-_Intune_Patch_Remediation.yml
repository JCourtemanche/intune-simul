description: 'Démonstrateur Exposure Management -> Intune : identifie le poste vulnérable, demande une validation, déclenche la mise à jour via Intune, suit son installation et clôture l''issue. Fonctionne avec l''intégration Intune (Demo) ou Microsoft Graph API.'
id: EM - Intune Patch Remediation
inputs:
- key: WindowsRemediationGroup
  value:
    simple: XSIAM-Remediation-Windows-Expedite
  required: false
  description: Groupe ciblé par la mise à jour Windows accélérée.
  playbookInputQuery: null
- key: MacOSRemediationGroup
  value:
    simple: XSIAM-Remediation-macOS-Update
  required: false
  description: Groupe ciblé par la mise à jour macOS.
  playbookInputQuery: null
- key: IOSRemediationGroup
  value:
    simple: XSIAM-Remediation-iOS-Update
  required: false
  description: Groupe ciblé par la mise à jour iOS.
  playbookInputQuery: null
- key: PatchTimeoutSeconds
  value:
    simple: '600'
  required: false
  description: Délai maximum d'attente de l'installation.
  playbookInputQuery: null
