contentitemexportablefields:
  contentitemfields: {}
description: 'Exposure Management -> Intune: remédie une vulnérabilité de poste utilisateur (Windows, macOS, iOS) en ajoutant le poste au groupe Intune ciblé par la stratégie de mise à jour, après approbation, puis vérifie l''installation du correctif et clôture l''issue. Fonctionne avec l''intégration Intune (Demo) ou l''intégration officielle Microsoft Graph API.'
id: EM - Intune Patch Remediation
inputs:
- key: WindowsRemediationGroup
  value:
    simple: XSIAM-Remediation-Windows-Expedite
  required: false
  description: Groupe Entra ID ciblé par le profil Intune de mise à jour Windows accélérée (expedite).
  playbookInputQuery: null
- key: MacOSRemediationGroup
  value:
    simple: XSIAM-Remediation-macOS-Update
  required: false
  description: Groupe Entra ID ciblé par la stratégie de mise à jour macOS.
  playbookInputQuery: null
- key: IOSRemediationGroup
  value:
    simple: XSIAM-Remediation-iOS-Update
  required: false
  description: Groupe Entra ID ciblé par la stratégie de mise à jour iOS.
  playbookInputQuery: null
- key: PatchTimeoutSeconds
  value:
    simple: '600'
  required: false
  description: Délai maximum d'attente de l'installation du correctif.
  playbookInputQuery: null
name: EM - Intune Patch Remediation
