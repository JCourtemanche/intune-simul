commonfields:
  id: Intune Demo
  version: -1
name: Intune Demo
display: Intune (Demo)
category: IT Services
description: Demo replacement of the Microsoft Graph API integration, targeting the Intune simulator. Exposes the same msgraph-api-request command and MicrosoftGraph context output as the official integration, so playbooks run unchanged in production.
detaileddescription: |-
  ## Intune (Demo)
  Drop-in replacement of the official **Microsoft Graph API** integration, used to demo Intune remediation without a Microsoft tenant.

  - **Server URL**: URL of the Intune simulator (Cloud Run), for example `https://intune-simulator-xxxx.a.run.app`. It serves both the token endpoint and the Graph API.
  - **Tenant ID / Application ID / Application Secret**: the `SIM_TENANT_ID`, `SIM_CLIENT_ID` and `SIM_CLIENT_SECRET` values of the simulator.

  To go to production, configure the official **Microsoft Graph API** integration (self-deployed app, client credentials) with these Graph application permissions: `DeviceManagementManagedDevices.Read.All`, `DeviceManagementManagedDevices.PrivilegedOperations.All`, `Device.Read.All`, `GroupMember.ReadWrite.All`, and disable this instance. The playbook does not change.
configuration:
- display: Server URL
  name: url
  type: 0
  required: true
  defaultvalue: https://intune-simulator-xxxxxxxx-ew.a.run.app
  section: Connect
- display: Tenant ID
  name: tenant_id
  type: 0
  required: true
  defaultvalue: 00000000-0000-0000-0000-000000000000
  section: Connect
- display: Application ID
  name: app_id
  type: 0
  required: true
  defaultvalue: 11111111-1111-1111-1111-111111111111
  section: Connect
- displaypassword: Application Secret
  name: credentials
  type: 9
  required: true
  hiddenusername: true
  section: Connect
- display: Trust any certificate (not secure)
  name: insecure
  type: 8
  required: false
  section: Connect
  advanced: true
- display: Use system proxy settings
  name: proxy
  type: 8
  required: false
  section: Connect
  advanced: true
script:
  script: ''
  type: python
  subtype: python3
  dockerimage: demisto/python3:3.12.13.10116658
  runonce: false
  commands:
  - name: msgraph-api-request
    description: Run a Microsoft Graph API query.
    arguments:
    - name: resource
      required: true
      description: The resource in Microsoft Graph to refer.
    - name: http_method
      auto: PREDEFINED
      predefined:
      - GET
      - POST
      - DELETE
      - PUT
      - PATCH
      defaultValue: GET
      description: The HTTP method used for the request to Microsoft Graph.
    - name: api_version
      auto: PREDEFINED
      predefined:
      - v1.0
      - beta
      defaultValue: v1.0
      description: The version of the Microsoft Graph API to use.
    - name: request_body
      description: The request body (required for POST queries).
    - name: odata
      description: OData system query options, e.g. $filter=startswith(givenName, 'J').
    - name: populate_context
      auto: PREDEFINED
      predefined:
      - 'true'
      - 'false'
      defaultValue: 'true'
      description: If "true" will populate the API response to the context data.
    - name: headers
      description: 'A comma-separated list of headers to send in the request, for example: ConsistencyLevel:eventual,User-Agent:MyApp/1.0.'
  - name: msgraph-api-test
    description: Tests connectivity to the token endpoint.
    arguments: []
fromversion: 6.10.0
tests:
- No tests
